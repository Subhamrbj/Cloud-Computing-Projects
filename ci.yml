name: CI
on: [push, pull_request]
jobs:
  daywell-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r 01_Personal_Diet_Planner/backend/requirements-dev.txt
      - run: cd 01_Personal_Diet_Planner/backend && python -m pytest -q
  daywell-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd 01_Personal_Diet_Planner/frontend && npm ci && npm run build

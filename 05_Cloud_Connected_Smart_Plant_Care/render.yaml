services:
  - type: web
    name: cloud-smart-plant-care
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: DATABASE_SCHEMA
        value: plantcare
      - key: ALLOW_REGISTRATION
        value: 'true'
      - key: MAX_PUBLIC_USERS
        value: '500'

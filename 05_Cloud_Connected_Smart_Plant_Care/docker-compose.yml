services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: verdant
      POSTGRES_USER: verdant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - plant-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdant"]
      interval: 5s
      retries: 10
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://verdant:${POSTGRES_PASSWORD}@database:5432/verdant
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
    depends_on:
      database:
        condition: service_healthy
volumes:
  plant-data:
